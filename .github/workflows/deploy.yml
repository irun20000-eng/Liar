name: Deploy to GitHub Pages

# 자동 배포는 보류 상태입니다.
# 배포하려면:
#   1) (private 저장소라면) 저장소를 public으로 전환하거나 GitHub Pro 이상 플랜 필요
#   2) Settings > Pages > Source 를 "GitHub Actions" 로 설정
#   3) Actions 탭에서 이 워크플로를 수동 실행(Run workflow)
# 준비가 되면 아래 push 트리거의 주석을 풀어 자동 배포로 전환할 수 있습니다.
on:
  workflow_dispatch:
  # push:
  #   branches: ["claude/liar-game-discussion-0h9oi"]

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 한 번만 배포 (진행 중 배포는 유지)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # Pages가 꺼져 있으면 자동으로 켜기

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # 저장소 루트의 정적 파일 전체

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
