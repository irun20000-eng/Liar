name: Deploy to GitHub Pages

# 이 브랜치에 푸시하면 저장소 루트 전체(라이어 게임 + trip/ 여행 플래너)를 Pages에 배포합니다.
# 주의: 저장소당 Pages 사이트는 1개라, 다른 브랜치의 배포 워크플로우와 같은 주소를 공유합니다(마지막 배포가 반영).
on:
  push:
    branches: ["claude/seoul-winter-trip-planner-wwd6v8"]
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 한 번만 배포 (진행 중 배포는 유지)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # Pages가 꺼져 있으면 자동으로 켜기

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # 저장소 루트의 정적 파일 전체

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
