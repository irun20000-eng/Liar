name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/liar-game-discussion-0h9oi"]
  workflow_dispatch:

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 한 번만 배포 (진행 중 배포는 유지)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # Pages가 꺼져 있으면 자동으로 켜기

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # 저장소 루트의 정적 파일 전체

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
